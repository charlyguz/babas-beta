<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página con aviso</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  #continuar { position: absolute; top: 20px; left: 20px; }
  #overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); z-index: 1000; }
  #aviso { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: #fff; padding: 16px; }
</style>
</head>
<body>
<button id="continuar" type="button">Continuar</button>
<p id="out"></p>

<div id="overlay">
  <div id="aviso">
    <p>Este sitio usa cookies.</p>
    <button id="aceptar" type="button">Aceptar cookies</button>
  </div>
</div>

<script>
  document.getElementById('continuar').addEventListener('click', function () {
    document.getElementById('out').textContent = 'continuado';
  });
  document.getElementById('aceptar').addEventListener('click', function () {
    document.getElementById('overlay').remove();
  });
</script>
</body>
</html>
